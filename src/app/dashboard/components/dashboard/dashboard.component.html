<div class="dashboard-container">
    <h2>Dashboard</h2>

    @if (currentUser(); as user) {
    <mat-card>
        <mat-card-header>
            <mat-card-title>Welcome!</mat-card-title>
            <mat-card-subtitle>
                Logged in as: {{ user.email }}
            </mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
            <p>Here's your authentication information:</p>
            <ul>
                <li><strong>UID:</strong> {{ user.uid }}</li>
                <li><strong>Email:</strong> {{ user.email }}</li>
            </ul>
        </mat-card-content>
        <mat-card-actions>
            <button mat-raised-button color="warn" (click)="logout()">
                Logout
            </button>
        </mat-card-actions>
    </mat-card>
    } @else {
    <mat-card>
        <mat-card-content>
            <p>Loading user information or user is not logged in...</p>
        </mat-card-content>
    </mat-card>
    }
</div>
