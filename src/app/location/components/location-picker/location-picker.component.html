<div class="location-picker-container">
  <div class="select-location">
    <search-place
      [(place)]="selectedPlace"
      placeholder="Enter a location"
    ></search-place>

    <div class="use-current-location-button-container">
      <button mat-raised-button (click)="pickCurrentLocation()">
        {{ text.useMyCurrentLocation }}
      </button>
    </div>
  </div>
  <map-display #mapDisplay [place]="selectedPlace()"></map-display>
</div>
