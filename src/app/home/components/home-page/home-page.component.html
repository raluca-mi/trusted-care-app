<div class="home-container">
  @if (currentUser() === undefined) {
  <div class="loading-shade">
    <mat-progress-spinner
      mode="indeterminate"
      diameter="50"
    ></mat-progress-spinner>
    <p>Loading profile...</p>
  </div>
  } @else if(currentUser()) {
   
  <div class="hero-section">
    <div class="hero-content">
      <h1>Welcome, {{ currentUser().firstName }}!</h1>
      </div>
  </div>
  }
</div>
